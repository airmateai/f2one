<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Baja · Fight2One</title>
<link rel="icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{--fondo:#0a0a0a;--blanco:#f5f5f2;--gris:#a3a3a0;--oro:#d4a72c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fondo);color:var(--blanco);font-family:Archivo,system-ui,sans-serif;padding:24px 16px;text-align:center}
.caja{max-width:460px}
.marca{display:inline-flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:var(--blanco)}
.marca img{width:72px;height:72px}
.marca b{font-stretch:75%;font-weight:900;font-size:22px;letter-spacing:.08em}
h1{font-stretch:75%;font-weight:900;font-size:56px;line-height:.95;text-transform:uppercase;margin:36px 0 14px}
p{color:var(--gris);line-height:1.55;margin:0 0 28px}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 28px;background:var(--oro);color:#000;font-weight:800;text-decoration:none;border-radius:2px;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
a.btn:hover{background:#e6bb42}
</style>
</head>
<body>
<main class="caja">
  <a class="marca" href="./"><img src="img/logo.webp" alt="" width="72" height="72"><b>FIGHT2ONE</b></a>
  <h1 id="tit">Un momento…</h1>
  <p id="txt">Estamos quitando tu email de la lista.</p>
  <a class="btn" href="./">Volver a la web</a>
</main>
<script>
const SB_URL='https://vjofxmfwdybktpwiuanc.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb2Z4bWZ3ZHlia3Rwd2l1YW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzU5NDYsImV4cCI6MjA5MDA1MTk0Nn0.ixU-33c0FEkO7F5xjWb3YHkvj_pQuR0gsJETrGA8ZTE';
const t=new URLSearchParams(location.search).get('t')||'';
const pon=(a,b)=>{ document.getElementById('tit').textContent=a; document.getElementById('txt').textContent=b; };
if(!/^[0-9a-f-]{36}$/i.test(t)){ pon('Enlace no válido','Usa el enlace «Darme de baja» que va al final de cualquiera de nuestros emails.'); }
else fetch(SB_URL+'/rest/v1/rpc/f2o_lista_baja',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+SB_ANON},body:JSON.stringify({p_token:t})})
  .then(r=>{ if(!r.ok) throw 0; pon('Hecho','Ya no recibirás más emails de Fight2One. Si cambias de idea, puedes volver a apuntarte en la web.'); try{ localStorage.removeItem('f2o_lista'); }catch(e){} })
  .catch(()=>pon('No se pudo','Inténtalo de nuevo en un rato. Si sigue fallando, escríbenos por Instagram (@fight2one) y te damos de baja a mano.'));
</script>
</body>
</html>
